name: Personal Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Prepare Android configuration
        run: |
          printf 'CLIENT_SECRET=\n' > private.properties
          chmod +x gradlew
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties

      - name: Build unsigned personal APK
        run: >-
          ./gradlew :app:androidApp:assemblePersonal
          --no-daemon --max-workers=2
          '-Dorg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8'
          '-Pkotlin.daemon.jvmargs=-Xmx2g'

      - name: Check profile interactions and update validation
        run: >-
          xvfb-run -a ./gradlew :app:shared:jvmTest
          --no-daemon --max-workers=2
          '-Dorg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8'
          '-Pkotlin.daemon.jvmargs=-Xmx2g'

      - name: Upload profile test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: profile-refresh-test-results
          path: app/shared/build/test-results/jvmTest/*.xml
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Android APKs
        uses: actions/upload-artifact@v6
        with:
          name: moelist-personal-unsigned
          path: app/androidApp/build/outputs/apk/personal/*.apk
          if-no-files-found: error
          retention-days: 14
