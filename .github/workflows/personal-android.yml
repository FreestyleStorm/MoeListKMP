name: Personal Android debug APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Prepare Android configuration
        run: |
          printf 'CLIENT_SECRET=\n' > private.properties
          chmod +x gradlew
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties

      - name: Build debug APK
        run: >-
          ./gradlew :app:androidApp:assembleDebug
          --no-daemon --max-workers=2
          '-Dorg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8'
          '-Pkotlin.daemon.jvmargs=-Xmx2g'

      - name: Upload Android APKs
        uses: actions/upload-artifact@v6
        with:
          name: moelist-personal-debug
          path: app/androidApp/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
